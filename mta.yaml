_schema-version: 3.3.0
ID: Lojinha
description: A simple CAP project.
version: 1.0.0

parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  - name: Lojinha-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: Lojinha-auth
      - name: Lojinha-db
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: npm-ci

  - name: Lojinha-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: Lojinha-db
    parameters:
      buildpack: nodejs_buildpack

  - name: Lojinha
    type: approuter.nodejs
    path: app/router
    requires:
      - name: srv-api
        group: destinations
        properties:
          forwardAuthToken: true
          name: srv-api
          url: ~{srv-url}
      - name: Lojinha-auth
      - name: Lojinha-destination-service
        group: destinations
        properties:
          forwardAuthToken: false
          name: ui5
          url: https://ui5.sap.com
      - name: Lojinha-html5-runtime
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}
    parameters:
      disk-quota: 256M
      keep-existing-routes: true
      memory: 256M

  # Este é o "deployer" correto para HTML5 apps no HTML5 Application Repository (repo host).
  - name: Lojinha-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: Lojinha-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - name: reservas
          artifacts:
            - reservas.zip
          target-path: resources/
        - name: sapfedemomateriais
          artifacts:
            - sapfedemomateriais.zip
          target-path: resources/
        - name: sapfedemofuncionariosfuncionarios
          artifacts:
            - sapfedemofuncionariosfuncionarios.zip
          target-path: resources/

  - name: reservas
    type: html5
    path: app/reservas
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build:cf
      supported-platforms: []

  - name: sapfedemomateriais
    type: html5
    path: app/materiais
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build:cf
      supported-platforms: []

  - name: sapfedemofuncionariosfuncionarios
    type: html5
    path: app/funcionarios
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build:cf
      supported-platforms: []

resources:
  - name: Lojinha-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: Lojinha-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - binding-secret
            - x509
          redirect-uris:
            - https://*~{app-api/app-uri}/**
    requires:
      - name: app-api

  - name: Lojinha-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  # Repo Host (onde o app-content faz upload dos zips)
  - name: Lojinha-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
      service-name: Lojinha-html5-service

  - name: Lojinha-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      service-name: Lojinha-destination-service
      config:
        HTML5Runtime_enabled: false
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: ui5
                Type: HTTP
                ProxyType: Internet
                Authentication: NoAuthentication
                URL: https://ui5.sap.com
        version: 1.0.0

  # Runtime (consumo das apps do repo em runtime; usado pelo approuter)
  - name: Lojinha-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime